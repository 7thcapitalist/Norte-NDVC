<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Norte Founder Network</title>
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: a small multi-page site. Black Norte masthead with pill navigation; each page opens with its own title band;
   the seven-step journey (numbered circles on a line) is the recurring device that explains stages everywhere. */
:root{
  --bg:#F4F3EE; --surface:#FFFFFF; --panel:#F2ECD6; --ink:#141414; --ink-2:#45423B; --muted:#757164;
  --line:#E2DDCD; --yellow:#F9CF1E; --gold:#D99A1E; --gold-ink:#7A5200; --on-yellow:#141414; --soft:#FFF6CC;
  --mast:#000000; --mast-2:#1C1B18; --mast-ink:#F4F3EE; --mast-muted:#B9B5A8; --todo:#D9D4C3;
  --shadow:0 1px 2px rgba(20,20,20,.05),0 8px 24px rgba(20,20,20,.06);
  --font:'Archivo',Arial,Helvetica,sans-serif; --r:20px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121210; --surface:#1D1C18; --panel:#27241C; --ink:#F4F3EE; --ink-2:#D2CEC2; --muted:#9C978A;
  --line:#34312A; --yellow:#F9CF1E; --gold:#D99A1E; --gold-ink:#F2C230; --on-yellow:#141414; --soft:#3A3113;
  --mast:#000000; --mast-2:#1C1B18; --mast-ink:#F4F3EE; --mast-muted:#A39F93; --todo:#45423A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121210; --surface:#1D1C18; --panel:#27241C; --ink:#F4F3EE; --ink-2:#D2CEC2; --muted:#9C978A;
  --line:#34312A; --yellow:#F9CF1E; --gold:#D99A1E; --gold-ink:#F2C230; --on-yellow:#141414; --soft:#3A3113;
  --mast:#000000; --mast-2:#1C1B18; --mast-ink:#F4F3EE; --mast-muted:#A39F93; --todo:#45423A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}
.wrap{max-width:1140px;margin-inline:auto;padding-inline:20px}

/* masthead + nav */
.mast{background:var(--mast);color:var(--mast-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.mast .wrap{display:flex;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;cursor:pointer;padding:0;color:var(--mast-ink)}
.brand svg{width:38px;height:33px}
.brand b{font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand span{color:var(--mast-muted);font-size:14px;font-weight:500}
.nav{margin-left:auto;display:flex;gap:6px;overflow-x:auto;max-width:100%;padding-block:2px}
.nav button{background:none;border:0;border-radius:999px;padding:9px 16px;font-weight:600;font-size:15px;color:var(--mast-muted);cursor:pointer;white-space:nowrap}
.nav button:hover{color:var(--mast-ink)}
.nav button[aria-current="page"]{background:var(--yellow);color:var(--on-yellow)}

/* page heads */
.head{background:var(--mast);color:var(--mast-ink);border-radius:0 0 32px 32px}
.head .wrap{padding-block:34px 44px;display:flex;flex-direction:column;gap:10px}
.head h1{font-weight:900;font-size:clamp(30px,5vw,50px);line-height:1.04;letter-spacing:-.02em;text-wrap:balance;max-width:20ch}
.head p{color:var(--mast-muted);font-size:18px;max-width:62ch}
.kicker{color:var(--yellow);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.1em}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:center;padding-block:40px 0}
.hero h1{max-width:15ch;font-size:clamp(34px,5.6vw,60px)}
.hero h1 em{font-style:normal;color:var(--yellow)}
.hero .art{align-self:end;display:flex;justify-content:center;gap:8px;min-width:0}
.hero .art img{height:300px;width:auto;border-radius:0;display:block}
.hero .copy{display:flex;flex-direction:column;gap:16px;padding-bottom:44px;min-width:0}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
@media (max-width:820px){.hero .wrap{grid-template-columns:minmax(0,1fr)}.hero .art img{height:190px}.hero .copy{padding-bottom:8px}}
.btn{background:var(--yellow);color:var(--on-yellow);border:0;border-radius:999px;padding:13px 22px;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.line{background:none;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.head .btn.line,.bar .btn.line{color:var(--mast-ink);box-shadow:inset 0 0 0 2px var(--mast-muted)}
.btn.sm{padding:9px 16px;font-size:15px}

main{display:flex;flex-direction:column;gap:48px;padding-block:40px 140px}
.sec{display:flex;flex-direction:column;gap:18px}
.sec > header{display:flex;flex-direction:column;gap:4px}
.sec h2{font-weight:800;font-size:clamp(22px,3vw,28px);letter-spacing:-.01em;text-wrap:balance}
.sec > header p{color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:24px}

/* numbers */
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:-34px}
.num{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;gap:2px}
.num b{font-weight:900;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.num span{color:var(--ink-2);font-size:15px;font-weight:500}
@media (max-width:700px){.nums{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* journey stepper */
.journey{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));position:relative}
.step{background:none;border:0;padding:0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative;min-width:0}
.step::before{content:"";position:absolute;top:27px;left:-50%;width:100%;height:4px;background:var(--todo)}
.step:first-child::before{display:none}
.step.done::before{background:var(--gold)}
.dot{width:58px;height:58px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 4px var(--todo);display:grid;place-items:center;font-weight:900;font-size:22px;position:relative;z-index:1;font-variant-numeric:tabular-nums;color:var(--muted)}
.step.has .dot{background:var(--yellow);box-shadow:inset 0 0 0 4px var(--gold);color:var(--on-yellow)}
.step.here .dot{background:var(--ink);box-shadow:0 0 0 6px var(--soft);color:var(--bg)}
.step.past .dot{background:var(--gold);box-shadow:none;color:var(--on-yellow)}
.step strong{font-size:15px;font-weight:700;line-height:1.2}
.step small{font-size:13px;color:var(--muted);line-height:1.3}
.step .ord{font-size:12px;font-weight:700;color:var(--gold-ink);text-transform:uppercase;letter-spacing:.08em}
@media (max-width:820px){
  .journey{grid-template-columns:minmax(0,1fr);gap:0}
  .step{flex-direction:row;align-items:center;text-align:left;gap:14px;padding:10px 0}
  .step::before{top:-50%;left:27px;width:4px;height:100%}
  .step .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
}
@media (min-width:821px){.step .txt{display:contents}}

/* people */
.av{width:46px;height:46px;border-radius:50%;background:var(--panel);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.av.top{background:var(--yellow);color:var(--on-yellow)}
.av.good{background:var(--gold);color:var(--on-yellow)}
.av.keep{background:var(--ink);color:var(--bg)}
.av.lg{width:84px;height:84px;font-size:30px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.pick{background:var(--surface);border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:12px;text-align:left;cursor:pointer;min-width:0}
.pick:hover,.prow:hover,.person:hover{transform:translateY(-2px)}
.pick,.prow,.person{transition:transform .15s ease}
@media (prefers-reduced-motion:reduce){.pick,.prow,.person{transition:none}.pick:hover,.prow:hover,.person:hover{transform:none}}
.who{display:flex;gap:12px;align-items:center;min-width:0}
.who div{min-width:0}
.who b{display:block;font-weight:800;font-size:18px;line-height:1.2;overflow-wrap:anywhere}
.who span{color:var(--gold-ink);font-weight:600;font-size:14px}
.pick p{color:var(--ink-2);font-size:16px}
.pick footer{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.by{color:var(--muted);font-size:14px}

/* mini tracker */
.mini{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mini .dots{display:flex;gap:4px}
.mini i{width:18px;height:8px;border-radius:999px;background:var(--todo)}
.mini i.on{background:var(--gold)}
.mini i.now{background:var(--ink)}
.mini span{font-size:14px;font-weight:700}
.mini small{font-size:13px;color:var(--muted)}

/* pills */
.pill{display:inline-flex;align-items:center;border-radius:999px;font-size:13px;font-weight:700;padding:5px 12px;background:var(--panel);color:var(--ink-2);white-space:nowrap}
.pill.top{background:var(--yellow);color:var(--on-yellow)}
.pill.good{background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--gold)}
.pill.keep{background:var(--ink);color:var(--bg)}
.pill.raise{background:var(--soft);color:var(--ink)}
.pills{display:flex;flex-wrap:wrap;gap:6px}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:16px;padding-bottom:22px;position:relative}
.tl li::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 4px var(--soft);margin-top:5px;position:relative;z-index:1}
.tl li::after{content:"";position:absolute;left:6px;top:14px;bottom:-6px;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl time{font-size:13px;font-weight:700;color:var(--gold-ink);text-transform:uppercase;letter-spacing:.06em}
.tl b{display:block;font-size:18px;font-weight:800}
.tl p{color:var(--ink-2)}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)}}
.note{background:var(--panel);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:12px}
.note h3{font-size:19px;font-weight:800}
.note p{color:var(--ink-2)}

/* pipeline page */
.lane{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:24px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;scroll-margin-top:90px}
.lane.none{background:none;box-shadow:inset 0 0 0 2px var(--line)}
.lane .lab{display:flex;flex-direction:column;gap:8px}
.lane .lab .row{display:flex;align-items:center;gap:12px}
.lane .lab strong{font-size:20px;font-weight:800;line-height:1.15}
.lane .lab p{color:var(--muted);font-size:15px}
.lane .dot{width:52px;height:52px;font-size:20px;flex:none}
.lane.any .dot{background:var(--yellow);box-shadow:inset 0 0 0 4px var(--gold);color:var(--on-yellow)}
.people{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.person{background:var(--bg);border:0;border-radius:999px;padding:6px 16px 6px 6px;display:flex;align-items:center;gap:10px;cursor:pointer;max-width:100%;text-align:left}
.person .av{width:36px;height:36px;font-size:13px}
.person b{font-size:15px;font-weight:700;display:block;line-height:1.2;overflow-wrap:anywhere}
.person small{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);align-self:center}
@media (max-width:700px){.lane{grid-template-columns:minmax(0,1fr)}}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--ink-2);font-size:14px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:14px;height:14px;border-radius:50%;display:inline-block}

/* founders page */
.filters{display:flex;flex-wrap:wrap;gap:10px}
.filters input,.filters select{background:var(--surface);border:0;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:999px;padding:11px 16px;min-width:0;font-size:15px;max-width:100%}
.filters input{flex:1 1 240px}
.list{display:flex;flex-direction:column;gap:10px}
.prow{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.3fr) minmax(0,1.2fr) 44px;gap:16px;align-items:center;cursor:pointer}
.prow .tags{display:flex;flex-wrap:wrap;gap:6px}
.star{background:var(--bg);border:0;width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1;color:var(--muted);flex:none}
.star[aria-pressed="true"]{background:var(--yellow);color:var(--on-yellow)}
@media (max-width:820px){.prow{grid-template-columns:minmax(0,1fr) 44px}.prow .tags,.prow .mini{grid-column:1 / -1}.prow .star{grid-row:1;grid-column:2}}

/* profile page */
.back{background:none;border:0;color:var(--mast-muted);cursor:pointer;padding:0;font-weight:600;font-size:15px;align-self:flex-start}
.phead{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.phead h1{max-width:none;font-size:clamp(28px,4.4vw,44px)}
.facts{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px 20px}
.facts dt{color:var(--muted);font-size:14px;font-weight:600;padding-top:2px}
.facts dd{margin:0;overflow-wrap:anywhere}
@media (max-width:560px){.facts{grid-template-columns:minmax(0,1fr);gap:2px}.facts dd{margin-bottom:12px}}
.read{background:var(--soft);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:10px}
.read h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold-ink)}
.read p{font-size:19px;font-weight:500;line-height:1.4}
.msg{background:var(--panel);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.msg textarea{width:100%;min-height:96px;background:var(--surface);border:0;border-radius:var(--r-sm);padding:12px;font-size:15px;resize:vertical}
.msg p{font-size:15px;color:var(--ink-2)}
.acts{display:flex;flex-wrap:wrap;gap:10px}

/* calls + how */
.blank{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:32px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.blank img{width:150px;height:auto;border-radius:16px;flex:none}
.blank div{flex:1 1 300px;display:flex;flex-direction:column;gap:10px;min-width:0}
.blank h3{font-size:22px;font-weight:800}
.blank ul{margin:0;padding-left:20px;color:var(--ink-2)}
.call{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:820px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.prof{border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:8px}
.prof.a{background:var(--mast);color:var(--mast-ink)}
.prof.b{background:var(--yellow);color:var(--on-yellow)}
.prof small{font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:13px}
.prof.a small{color:var(--yellow)}
.prof h3{font-size:24px;font-weight:800;line-height:1.2}
.defs{display:flex;flex-direction:column}
.defs div{display:grid;grid-template-columns:52px minmax(0,1fr);gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.defs div:first-child{border-top:0}
.defs .dot{width:44px;height:44px;font-size:17px;background:var(--yellow);box-shadow:none;color:var(--on-yellow)}
.defs b{display:block;font-weight:800}
.defs span{color:var(--ink-2)}
.team{display:flex;flex-wrap:wrap;gap:10px}
.team span{background:var(--surface);border-radius:999px;padding:8px 16px 8px 8px;display:flex;align-items:center;gap:10px;font-weight:600;box-shadow:var(--shadow)}
.team .av{width:32px;height:32px;font-size:12px}

/* shortlist bar */
.bar{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;justify-content:center;pointer-events:none}
.bar > div{pointer-events:auto;background:var(--mast);color:var(--mast-ink);border-radius:999px;padding:10px 12px 10px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 12px 40px rgba(0,0,0,.35);max-width:100%}
.bar b{font-weight:700}
@media (max-width:560px){.bar > div{border-radius:24px;padding:14px}}

/* v3: editing, ratings, team */
.rate{color:var(--gold);font-size:15px;letter-spacing:1px;white-space:nowrap;align-self:center}
.rate i{font-style:normal;color:var(--todo)}
.rate.big{font-size:20px}
.head .rate i{color:#4A473F}
.pill.drop{background:var(--ink);color:var(--bg);opacity:.75}
.dropnote{background:var(--panel);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 6px 0 0 var(--ink)}
.dropnote b{font-size:19px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form .wide{grid-column:1 / -1}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld > span{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fld input,.fld select,.fld textarea,#imp{background:var(--bg);border:0;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:var(--r-sm);padding:11px 14px;width:100%;font-size:16px;resize:vertical}
@media (max-width:640px){.form{grid-template-columns:minmax(0,1fr)}}
.setrate{display:flex;gap:4px}
.setrate button{background:var(--bg);border:0;width:42px;height:42px;border-radius:50%;font-size:20px;color:var(--todo);cursor:pointer}
.setrate button.on{background:var(--yellow);color:var(--on-yellow)}
.btn.dark{background:var(--ink);color:var(--bg)}
.edit{background:var(--panel);border-radius:var(--r);padding:24px}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.member{display:flex;flex-direction:column;gap:14px;padding:22px}
.mlist{display:flex;flex-direction:column}
.mrow{background:none;border:0;border-top:1px solid var(--line);padding:10px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;text-align:left}
.mrow b{display:block;font-size:15px;font-weight:700;overflow-wrap:anywhere}
.mrow small{color:var(--muted);font-size:13px}
.mrow span:first-child{min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(84px + env(safe-area-inset-top,0px));z-index:20;background:var(--ink);color:var(--bg);border-radius:20px;padding:12px 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;max-width:min(520px,calc(100vw - 32px));box-shadow:0 12px 40px rgba(0,0,0,.35);font-weight:600}
.dump{width:100%;min-height:120px;background:var(--surface);color:var(--ink);border:0;border-radius:12px;padding:10px;font-size:13px}
</style>
</head>
<body>

<header class="mast"><div class="wrap">
  <button class="brand" id="brand" aria-label="Home">
    <svg viewBox="0 0 140 120" aria-hidden="true"><polyline points="14,110 14,52 58,92 118,24" fill="none" stroke="#F9CF1E" stroke-width="13"/><polygon points="96,18 130,8 124,44" fill="#F9CF1E"/></svg>
    <b>Founder Network</b><span>NDVC × Norte</span>
  </button>
  <div class="nav" id="nav" role="navigation" aria-label="Pages"></div>
</div></header>

<div id="page"></div>

<div class="bar" id="bar" hidden><div>
  <b id="bar-n"></b>
  <button class="btn sm" id="bar-copy">Copy list for João</button>
  <button class="btn sm line" id="bar-clear">Clear</button>
</div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
let UPDATED = "Oct 7, 2026";
const STAGES = [
  ["sourced","Sourced","On the list, nothing sent yet"],
